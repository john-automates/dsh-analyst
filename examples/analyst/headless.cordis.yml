# Headless overlay: mount the shipped agent-preset roster and default to
# `analyst`. `apps/cli` injects the shipped preset root when this row is
# present. The headless runner joins the default preset when
# `ctx.agentPresets` exists. No DeepSeek API key is required; configure a
# Qwen (or other) OpenAI-compatible route in settings instead.
#
# Run from the case directory, or set DSH_CASE_DIR to that directory. When
# DSH_CASE_DIR is set, the session workspace, tool cwd, and persona case
# directory are that path. Investigation still denies writes outside the case
# and keeps evidence read-only.
#
# An id-targeted patch replaces the whole config, so this row restates the
# shipped bundle's required `task` while stamping cwd.

- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: analyst

- id: headless-runner
  config:
    task: !!js ctx.headlessStartup.task
    cwd: !!js process.env.DSH_CASE_DIR ?? process.env.DSH_CWD ?? process.cwd()
