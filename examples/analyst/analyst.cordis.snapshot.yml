# Keyless replay counterpart for the analyst pcap-case snapshot. Includes the
# headless-agent spine, replaces the live model with llm-replay, and mounts
# the investigation ledger plus SOC/NSM tools. Fake tshark/capinfos paths
# come from the snapshot harness environment.

- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../headless-agent/cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
                      contextWindow: 128000
          - id: investigation
            name: '@deepseek-ai/dsh-investigation'
            config:
              caseDir: !!js process.env.DSH_CASE_DIR ?? process.cwd()
              evidenceReadOnly: true
              autoHunt: true
          - id: analyst-tools
            name: '@deepseek-ai/dsh-analyst-tools'
            config:
              tsharkBin: !!js process.env.DSH_TSHARK_BIN ?? 'tshark'
              capinfosBin: !!js process.env.DSH_CAPINFOS_BIN ?? 'capinfos'
              maxOutputChars: 4000
              commandTimeoutMs: 5000
