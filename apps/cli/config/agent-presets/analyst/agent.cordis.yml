# The `analyst` agent preset: an investigation agent, not a coding-agent skin.
#
# Standard, code, minimal, and cordis stay shipped. This composition adds a
# fifth preset. Service rows sit in isolate groups so the standing mount does
# not publish into the process-global realm.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are an investigation analyst powered by the {{model}} model, not a
      coding agent. Your case directory is {{cwd}}. Define the Investigation
      Question before collecting more evidence.

- id: investigation-stack
  name: cordis:group
  group: true
  isolate:
    investigation: true
    judgment: true
  config:
    # System One judgment, in the same realm as `investigation` so its
    # `ctx.get('judgment')` resolves this instance. The seam is optional by
    # construction: with no usable provider the shipped predicates stand, so a
    # missing TYPESAFE_API_KEY degrades the bind gate rather than failing mount.
    - id: judgment
      name: '@deepseek-ai/dsh-judgment'

    - id: judgment-typesafe
      name: '@deepseek-ai/dsh-judgment-typesafe'

    - id: investigation
      name: '@deepseek-ai/dsh-investigation'
      config:
        caseDir: !!js process.env.DSH_CASE_DIR ?? process.env.DSH_CWD ?? process.cwd()
        evidenceReadOnly: true
        autoHunt: true
        # Refuse a close that asserts an indicator no tool result carried.
        # Off unless asked for: the gate changes what a close may say, and it
        # is still being measured against the graded corpus. The `investigation`
        # entry sits inside this preset rather than the profile tree, so a
        # `--patch` overlay cannot reach it — an env var is how `caseDir`
        # already crosses the same boundary.
        requireGroundedReport: !!js process.env.DSH_REQUIRE_GROUNDED_REPORT === '1'
        # Refuse shell programs that reach the network. Off unless asked for:
        # resolving a destination is legitimate tradecraft for a customer on
        # their own traffic, and wrong only when grading against a corpus whose
        # answers are published.
        denyNetworkReachback: !!js process.env.DSH_DENY_NETWORK_REACHBACK === '1'

    - id: analyst-tools
      name: '@deepseek-ai/dsh-analyst-tools'
      config:
        maxOutputChars: 32000
        commandTimeoutMs: 60000
        tsharkBin: tshark
        capinfosBin: capinfos

# Persistent shell scoped to the case directory through the session cwd.
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell whose working directory is the case directory.
          Evidence under evidence/ and capture files stay read-only. Do not execute
          malware or operate on paths outside the case directory. Prefer pcap_filter,
          pcap_info, and logs for packet and log work.

    - id: terminal-pwsh
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform !== 'win32'
      config:
        shellDialect: pwsh
        timeoutMs: 300000

    - id: persistent-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh-persistent'
      disabled: !!js process.platform !== 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a PowerShell shell whose working directory is the case directory.
          Evidence and capture files stay read-only. Do not execute malware or operate
          on paths outside the case directory.

# Bare local filesystem for this case. Headless stamps DSH_CASE_DIR as the
# session workspace so glob/read follow this cwd. Writes to evidence are still
# denied by the investigation pre-execute policy.
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CASE_DIR ?? process.env.DSH_CWD ?? process.cwd()

    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'

    - id: tool-fs-search
      name: '@deepseek-ai/dsh-tool-fs-search'
      config:
        sampleOverCapGlobResults: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false
